[project]
name = "recommendation-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=37.0.0",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "openai-agents>=0.17.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.14",
]

[dependency-groups]
dev = ["hypothesis>=6.155.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
